[Server]
Enabled=1
Port=27311
SampleRateHz=60

; Brief in-game startup/loading notices, independent of the optional full HUD.
; Errors remain visible until resolved. Requires the same D3D12/SDR renderer.
[Notifications]
Enabled=1
DurationMilliseconds=6000

; Authored lights and current rendered lights. Requires an exactly supported build.
[Lights]
Enabled=1
; Radius around the player in game units (the metre conversion is unknown).
NearbyRadius=100
; GPU readback instrumentation, including paired scene constants, in the same ASI.
ManyLights=1
; Independent of the server sample rate. Supported range: 1-60 Hz.
ManyLightsSampleRateHz=20

; Optional research console, formerly CrimsonHueConsole. Restart after changes.
[Console]
EnableConsole=0
PatchGates=1
PatchDevFlags=1
EarlyBreakpoint=1
HideNotification=1
VerboseDiscovery=0
InitDelayMs=5000

; Optional file-command research interface. Automatic ManyLights does not need it.
[Explorer]
EnableExplorer=0
AllowWrite=0
AllowCall=0
AllowDebugCommands=0
AllowBreakpoints=0
AllowManyLights=0
PollIntervalMs=100
CmdFile=inject_cmd.txt
ResultFile=inject_result.txt

; Optional in-game Dear ImGui HUD. Restart the game after changing settings.
; Supports DirectX 12 with 8-bit SDR output. HDR is not supported.
[Overlay]
; Disabled by default: no HUD graphics hooks, shortcuts or WebSocket client.
; Set to 1 and restart the game to enable. Telemetry runs independently.
Enabled=0
; Only controls initial visibility when Enabled=1; F8 can then show/hide the HUD.
InitiallyVisible=1
ShowDetails=0
; Decimal Windows virtual-key codes: 119=F8, 120=F9; 0 disables a shortcut.
ToggleKey=119
DetailsKey=120
; 0=top left, 1=top right, 2=bottom left, 3=bottom right
Corner=0
; Automatic scaling relative to 1080p; Scale remains an additional user multiplier.
AutoScale=1
Scale=1.0
Opacity=0.92
StaleMilliseconds=1000
