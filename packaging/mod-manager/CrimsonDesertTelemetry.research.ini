[Server]
Enabled=1
Port=27311
SampleRateHz=60

; Silent during normal startup/loading; brief success once the scene/data is ready.
; Errors remain visible until resolved. Uses the same D3D12 SDR/HDR renderer.
[Notifications]
Enabled=1
DurationMilliseconds=6000

; Authored lights and current rendered lights. Requires an exactly supported build.
[Lights]
Enabled=1
; Radius around the player in game units (the metre conversion is unknown).
NearbyRadius=100
; GPU readback instrumentation, including paired scene constants, in the same ASI.
ManyLights=1
; Independent of the server sample rate. Supported range: 1-60 Hz.
ManyLightsSampleRateHz=20

; Global upper-hemisphere sky plus local camera sky visibility and ambient estimate.
; These are working-space estimates, not measured room brightness or physical lux.
; Separate HTTP/WebSocket sky feed at up to 2Hz; visibility has its own cadence.
; Requires Lights/ManyLights above.
; Research/AmbientProbe must be 0; that exclusive diagnostic pauses both feeds.
[Ambient]
Enabled=1

; Geometric player-to-source visibility, additional to unchanged raw light RGB.
; The trace origin is player position +1 on world Y. Camera direction and whether
; a source is on screen do not participate. Unknown/stale is never treated as OFF.
[SourceVisibility]
Enabled=1

; Private diagnostics. Off by default; do not replace any API stream.
; 1 installs a bounded passive texture/barrier/lifecycle observer (no GPU copy).
; IDLE until scripts/Start-SpatialProbe.ps1. Keep AmbientProbe=0 for this test.
[Research]
; Natural sphere-query observation only, exact EXE 1.0.0.2976. IDLE until
; scripts/Start-PhysicsProbe.ps1. No added physics calls or visibility API changes.
PhysicsProbe=0
; Preserved research-build acquisition/export settings, separate from the minimal
; production SourceVisibility path. Full binary snapshots use about 16.25 MiB each.
SignedDistanceReadback=0
; Bounded 1..120 copies, one retained in memory; each saved immediately to bin64.
SignedDistanceReadbackCount=120
SignedDistanceReadbackIntervalMs=2000
SpatialProbe=0
; Separate opt-in: guarded texture/GI/exposure readback instead of broad passive
; tracing. Requires SpatialProbe=1, AmbientProbe=0, Lights/ManyLights=1.
; Pairing is same-submission, not binding-proven; preserves raw/smoothed lights and sky.
SpatialReadback=0
; Repeat the SAME transaction to measure spread at one place, 1..8 per process.
; One reused destination, never re-armed before the previous map finished.
; Out-of-range values fall back to the proven single transaction.
SpatialReadbackCount=1
; Minimum milliseconds between transactions, 250..10000. Not a sample rate:
; a transaction still only arms on a selected exposure dispatch.
SpatialReadbackIntervalMs=1000
; How long the live camera sky-visibility value keeps refreshing on /v1/ambient,
; in seconds; 0 leaves it off. Separate from SpatialReadbackCount, which bounds
; only how many full snapshots the diagnostic report retains.
SpatialVisibilitySeconds=0
AmbientProbe=0

; Separate derived HTTP/WebSocket stream. Raw RGB stays unchanged; additional
; source visibility metadata follows every original contribution unchanged.
[LightSmoothing]
; Exponential time constant, not a delay/window; 0 disables temporal smoothing.
TimeConstantMilliseconds=200
; Maximum spatial group extent in game units, 0.01-1; decimal point required.
; Proximity is not physical lamp identity. Directions remain per contribution.
GroupRadius=0.15

; Optional research console, formerly CrimsonHueConsole. Restart after changes.
[Console]
EnableConsole=0
PatchGates=1
PatchDevFlags=1
EarlyBreakpoint=1
HideNotification=1
VerboseDiscovery=0
InitDelayMs=5000

; Optional file-command research interface. Automatic ManyLights does not need it.
[Explorer]
EnableExplorer=0
AllowWrite=0
AllowCall=0
AllowDebugCommands=0
AllowBreakpoints=0
AllowManyLights=0
PollIntervalMs=100
CmdFile=inject_cmd.txt
ResultFile=inject_result.txt

; Optional in-game Dear ImGui HUD. Restart the game after changing settings.
; DirectX 12: SDR, HDR10 (10-bit PQ/BT.2020), and scRGB (linear FP16).
; HDR rendering has automated coverage; a live HDR game/display test is pending.
[Overlay]
; Enabled by default. F8 hides the corner HUD independently.
; Graphics/client remain active if LightOverlay or Notifications are enabled.
Enabled=1
; Only controls initial visibility when Enabled=1; F8 can then show/hide the HUD.
InitiallyVisible=1
ShowDetails=0
; F9 diagnostics polls the neutral ambient endpoint and shows raw values/independent ages.
; Off while [Ambient] above is off; it would only ever display "disabled".
ShowAmbient=1
; Oblique local light overview; 0 restores the original root/camera compass.
Radar3D=1
; Decimal Windows virtual-key codes: 119=F8, 120=F9; 0 disables a shortcut.
ToggleKey=119
DetailsKey=120
; 0=top left, 1=top right, 2=bottom left, 3=bottom right
Corner=0
; Automatic scaling relative to 1080p; Scale remains an additional user multiplier.
AutoScale=1
Scale=1.0
Opacity=0.92
; UI reference white for HDR10/scRGB, in nits; 80-500. Does not change API values.
; Shared by radar, light markers and status notices, even if the corner HUD is off.
HdrPaperWhiteNits=200
StaleMilliseconds=1000

; Independent fullscreen world-space light markers. Passive: no mouse capture.
; Uses current filtered ManyLights, NOT a complete 360-degree lamp registry.
; Markers preserve raw records, including blocked lights. SourceVisibility adds
; visible/blocked/unknown labels; linear brightness is not lumens.
[LightOverlay]
Enabled=1
InitiallyVisible=1
; 121=F10; 0 disables the shortcut. F8 does not affect these world markers.
ToggleKey=121
; Initial HUD/radar display mode only. Raw and smoothed API records stay complete.
; 1 hides freshly known blocked sources; unknown/stale sources remain visible.
HideOccluded=0
; 122=F11 toggles HideOccluded for both light views; 0 disables this shortcut.
; All four HUD keys are configurable decimal Windows virtual-key codes.
OcclusionToggleKey=122
; Shared display radius for world markers and the corner 3D radar, in game units.
; Cannot recover records missing from the source or outside Lights.NearbyRadius.
Radius=35
MaxMarkers=512
MaxLabels=6
; Legacy research HUD trace details. Production source visibility and its display
; are controlled by SourceVisibility/Enabled and HideOccluded above. Keep this off.
OcclusionTest=0
